version: $(VERSION)-alpha (#{build})
skip_tags: true
environment:
  JAVA_HOME: C:\Program Files\Java\jdk21
  GITHUB_TOKEN:
    secure: mIxbyFSpUuMyOA9YhYQO53caIbPBIH3zwahKMu9buYBl3It5v5APVCkfPKjR2PI8UfkTl1vP/S2u6LIAHnk1h8Zq5K5wqT3TfY1NBpBAhRZPrMt1LZnQ8B1NcQI3YKN2 #有效期至2027-06-30
  PROJECT_NAME: ultimate-scaler
  VERSION: 0.4.0+1.21
  DEPLOYMENT_LINK: "https://github.com/INF32768/UltimateScaler/releases/tag/nightly"
cache:
  - C:\Users\appveyor\.gradle\caches\fabric-loom
  - C:\Users\appveyor\.gradle\caches\modules-2
build_script:
  - cmd: >-
      gradlew build --no-daemon
# Nightly PowerShell helpers live in scripts/.
after_build:
  - ps: >-
      .\scripts\nightly-after-build.ps1
artifacts:
  - path: $(NIGHTLY_FILE_PATH)
    name: UltimateScaler.jar
deploy_script:
  - ps: >-
      .\scripts\nightly-deploy.ps1
