version: $(VERSION) (#{build})
skip_non_tags: true
clone_depth: 1
environment:
  JAVA_HOME: C:\Program Files\Java\jdk21
  VERSION: 0.4.0+1.21
  MODRINTH_TOKEN:
    secure: fWiy469s1i9inUqolxCiEOBxKmO/OJbMUstIZnF0Nakh4Bkn7tW6zxRaK4jeJkI/iRkzRlLxX5q1sTSBfNRunnx6ohXyErCGq89GBWHHQJ0= #有效期至2027-06-30
  CURSEFORGE_API_KEY:
    secure: Lsc69LdODomCgKl91L82ICrPHJk8DPV9brLVSfYmrxpIYyGdB4xJOrkhFpSfJIJt #无限期有效，计划于2027-06-30手动替换
cache:
  - C:\Users\appveyor\.gradle\caches\fabric-loom
  - C:\Users\appveyor\.gradle\caches\modules-2
build_script:
  - cmd: >-
      gradlew build --no-daemon
      
      gradlew curseforge --no-daemon
      
      gradlew modrinth --no-daemon
artifacts:
  - path: .\build\libs\Ultimate-Scaler-$(VERSION).jar
    name: UltimateScaler-$(VERSION).jar
  - path: .\build\libs\Ultimate-Scaler-$(VERSION)-sources.jar
    name: UltimateScaler-$(VERSION)-sources.jar
deploy:
  - provider: GitHub
    tag: v$(VERSION)
    release: $(VERSION)
    description:
    auth_token:
      secure: mIxbyFSpUuMyOA9YhYQO53caIbPBIH3zwahKMu9buYBl3It5v5APVCkfPKjR2PI8UfkTl1vP/S2u6LIAHnk1h8Zq5K5wqT3TfY1NBpBAhRZPrMt1LZnQ8B1NcQI3YKN2 #有效期至2027-06-30
    artifact: UltimateScaler-$(VERSION).jar
    draft: false
    prerelease: false
